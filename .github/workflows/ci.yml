# Continuous integration for the AgentChat workspace.
#
# This is the gate described in docs/SUBAGENT-PROTOCOL.md section 7.1. It runs
# the same commands a contributor is required to run locally before opening a
# pull request, plus the integration suite against a real PostgreSQL, plus the
# board validation that keeps docs/progress/ honest.
#
# Job structure, and why it is shaped this way:
#
#   static       format:check, lint, board:check   — no build, no database
#   unit         build, typecheck, test            — needs a build, no database
#   integration  build, test:integration           — needs a build and Postgres
#   ci           aggregate gate over the three above
#
# The three working jobs have no `needs:` between them, so they start at the
# same time and a red lint never hides a red test. Finding out about a
# formatting nit and three broken tests in one run is strictly better than
# discovering them over three pushes. Steps inside a job are guarded so one
# failing step does not mask the ones after it either.
#
# The grouping follows what each command needs rather than what it is called.
# `format:check` and `lint` are the same Biome invocation family and fail
# together often enough that splitting them buys nothing; `typecheck` and
# `test` both consume the output of `pnpm build`, so running them in one job
# builds once instead of twice.
#
# JOB NAMES ARE PART OF THE CONTRACT. Branch protection on `main` references
# them. `static`, `unit`, `integration` and `ci` must not be renamed casually;
# renaming one silently removes a required check. Prefer making `ci` the single
# required check, since it already fans in over everything else and survives the
# addition of new jobs.

name: CI

on:
  # `push` is limited to `main` on purpose. A push to a task branch that also
  # has an open pull request would otherwise run this workflow twice for the
  # same commit, and this repository is built by several agents pushing task
  # branches in parallel. Pull requests cover branch work; this covers what
  # actually landed.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# Superseded runs on a branch are pointless once a newer commit exists. Runs on
# `main` are never cancelled, because the history of what was green matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # --------------------------------------------------------------------------
  # Everything that only needs the source text: formatting, lint, and the
  # board. Cheapest job, so it is usually the first red signal.
  #
  # The runner is pinned rather than tracking `ubuntu-latest`, for the same
  # reason docs/IMPLEMENTATION-PLAN.md section 12.5 refuses `latest` image tags:
  # an image that changes under you turns an unrelated pull request into the
  # place where a toolchain upgrade is discovered. Bumping it is a commit.
  # --------------------------------------------------------------------------
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      # pnpm must exist before setup-node, because `cache: pnpm` asks the pnpm
      # binary where its store lives. No `version:` input here: the action reads
      # the `packageManager` field in package.json, so the pnpm version is
      # pinned in exactly one place.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          # .nvmrc, not a literal, so CI and local development cannot drift.
          node-version-file: .nvmrc
          # This is the pnpm store cache. Its key is the hash of pnpm-lock.yaml,
          # so it is reused across runs and invalidated exactly when the
          # dependency graph changes.
          cache: pnpm

      # .npmrc sets engine-strict, so this also asserts the runner's Node
      # satisfies the >=22.12 engines range before anything else runs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # `!cancelled()` rather than the default: a formatting failure must not
      # hide a lint failure or a broken board. The job still goes red.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      # The progress board is a gate, not documentation: it is what stops two
      # agents from claiming overlapping paths. T-008 will add a dedicated
      # workflow for it; until then it belongs here rather than nowhere.
      - name: Validate the progress board
        if: ${{ !cancelled() }}
        run: pnpm board:check

  # --------------------------------------------------------------------------
  # Types and unit tests. `pnpm test` runs the `unit` Vitest project only and
  # touches no external service.
  # --------------------------------------------------------------------------
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Recursive and `--if-present`, so this is a no-op until packages/ and
      # server/ exist and is correct the moment they do. Nothing downstream is
      # meaningful if it fails, hence the step id and the guards below.
      - name: Build
        id: build
        run: pnpm build

      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm typecheck

      # Runs even when typecheck failed: Vitest transpiles without type
      # checking, so "types are wrong" and "behaviour is wrong" are independent
      # answers and both are worth having from one run.
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test

      # Coverage is configured in vitest.config.ts to land in coverage/, which
      # is gitignored. Keeping the lcov report makes a run inspectable after the
      # fact without re-running it.
      - name: Upload coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Integration tests against a real PostgreSQL. Never a mock: the schema
  # constraints are the thing under test (Plan section 9). The `integration`
  # Vitest project has a global setup that refuses to start unless DATABASE_URL
  # is a valid postgres: URL, so this job either has a database or fails loudly.
  # --------------------------------------------------------------------------
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # Pinned to a major, never `latest`. Plan section 12.5 pins the compose
        # Postgres image the same way and puts major upgrades outside the app's
        # scope, so CI must not float onto a new major on its own.
        # Must track the major version in docker-compose.yml. Testing against a
        # different major than developers run is how a version-specific behaviour
        # ships green and breaks on someone else's machine.
        image: postgres:18
        env:
          # Throwaway credentials for a container that exists for the length of
          # one job and listens only on the runner's loopback. Not a secret, and
          # deliberately not wired to a repository secret, which would make a
          # fork's pull request unable to run this job at all.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentchat_test
        ports:
          - 5432:5432
        # Without a health check the job races the container: Postgres accepts a
        # TCP connection some seconds before it will accept a query.
        options: >-
          --health-cmd "pg_isready --username postgres --dbname agentchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentchat_test

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        id: build
        run: pnpm build

      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:integration

  # --------------------------------------------------------------------------
  # One check to require in branch protection. It fans in over every other job,
  # so adding a job later does not mean editing the protection rule, and a job
  # that was skipped or cancelled is treated as "not green" rather than silently
  # satisfying the rule.
  # --------------------------------------------------------------------------
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [static, unit, integration]

    steps:
      - name: Require every job to have succeeded
        env:
          # Results reach the shell as environment variables rather than being
          # interpolated into the script body, so nothing from the expression
          # context is ever parsed as shell.
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail

          failed=0
          printf '%-12s %s\n' static "$STATIC_RESULT"
          printf '%-12s %s\n' unit "$UNIT_RESULT"
          printf '%-12s %s\n' integration "$INTEGRATION_RESULT"

          for result in "$STATIC_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one CI job did not succeed."
            exit 1
          fi

          echo "All CI jobs succeeded."
